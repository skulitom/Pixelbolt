name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the whole matrix on the tagged commit and publishes only if every job passes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - name: Compile the large figure under a bounded heap
        run: node --max-old-space-size=48 --max-semi-space-size=4 scripts/bench-figure-memory.mjs
      - run: npm pack --dry-run


  # Builds each portable archive on a fresh runner of its own system and runs it the way a computer without
  # developer tools would.
  studio:
    name: Portable Studio / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          # The Intel build runs through Rosetta on the Apple silicon runner.
          - { os: macos-latest, target: darwin-x64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      # The pinned Node.js runtimes come from nodejs.org once per version and runner system, then from this cache, so a
      # dropped download no longer turns main red (P-053). A download also retries a dropped, stalled or slow
      # connection, and the pinned SHA-256 checks every archive, cached or not. The archives are the same on every
      # system, so a runner without its own entry starts from another system's: the ARM Linux runner's route to
      # nodejs.org has crawled at 38 KB/s.
      - name: Read the pinned Node.js version
        id: pinned
        shell: bash
        run: echo "version=$(node --input-type=module -e "import { NODE_VERSION } from './scripts/build-studio.mjs'; console.log(NODE_VERSION)")" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned runtimes
        id: runtimes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/.cache
          key: studio-node-${{ steps.pinned.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: studio-node-${{ steps.pinned.outputs.version }}-
          enableCrossOsArchive: true
      # Every runner builds every target and prints the archives' hashes, so builds made on different systems can be
      # compared. It comes first so that the cache is saved with all five runtimes even when a later step fails.
      - name: Build every target on this system
        shell: bash
        run: |
          node scripts/build-studio.mjs --target all --out dist-all
          cat dist-all/*.sha256
      - name: Save the pinned runtimes
        if: steps.runtimes.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/.cache
          key: ${{ steps.runtimes.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      - name: Build the archive
        run: node scripts/build-studio.mjs --target ${{ matrix.target }}
      - name: Build it again and compare
        run: node scripts/build-studio.mjs --target ${{ matrix.target }} --check
      - name: Verify the archive with Node.js and git off PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $zip = (Get-Item dist/PixelboltStudio-*-win-x64.zip).FullName
          Get-Content "$zip.sha256"
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP/studio"
          $node = (Get-Item "$env:RUNNER_TEMP/studio/*/runtime/node.exe").FullName
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          if (Get-Command node, git -ErrorAction SilentlyContinue) { throw 'Node.js or git is still on PATH' }
          & $node scripts/verify-studio.mjs $zip
      - name: Make sure Rosetta is there for the Intel build
        if: matrix.target == 'darwin-x64'
        run: softwareupdate --install-rosetta --agree-to-license || true
      # The script gives everything it starts a PATH with no Node.js, npm or git, wherever this system keeps them.
      - name: Verify the archive on its own runtime (macOS and Linux)
        if: runner.os != 'Windows'
        run: |
          archive=$(ls "$PWD"/dist/PixelboltStudio-*-${{ matrix.target }}.tar.gz)
          cat "$archive.sha256"
          mkdir "$RUNNER_TEMP/studio"
          tar -xzf "$archive" -C "$RUNNER_TEMP/studio"
          "$RUNNER_TEMP"/studio/*/runtime/node scripts/verify-studio.mjs "$archive"
      - name: Run the test suite on the bundled runtime (Windows)
        if: runner.os == 'Windows'
        run: '& (Get-Item "$env:RUNNER_TEMP/studio/*/runtime/node.exe").FullName --test'
      - name: Run the test suite on the bundled runtime (macOS and Linux)
        if: runner.os != 'Windows'
        run: '"$RUNNER_TEMP"/studio/*/runtime/node --test'
      # A real browser walks the extracted build's studio: samples, editing, downloads, drafts, keyboard, window sizes.
      - name: Walk the studio in the runner's browser (Windows)
        if: runner.os == 'Windows'
        run: |
          $build = (Get-Item "$env:RUNNER_TEMP/studio/*").FullName
          & "$build/runtime/node.exe" scripts/qa-studio.mjs --app "$build/app" --out "$env:RUNNER_TEMP/studio-qa"
      # The ARM Linux runner may have no Chromium-based browser; the script then says so and exits with 3. The
      # Intel Mac job is left out: its studio files are the same as the Apple silicon build's, and a browser started
      # from the translated runtime is translated too and does not come up in time.
      - name: Walk the studio in the runner's browser (macOS and Linux)
        if: runner.os != 'Windows' && matrix.target != 'darwin-x64'
        run: |
          build=$(ls -d "$RUNNER_TEMP"/studio/*)
          "$build/runtime/node" scripts/qa-studio.mjs --app "$build/app" --out "$RUNNER_TEMP/studio-qa" || { code=$?; if [ "$code" = 3 ] && [ "${{ matrix.target }}" = linux-arm64 ]; then echo "No browser on this runner; the studio walk did not run here."; else exit "$code"; fi; }

  # Speed is reported here, never asserted in the suite or the studio walk: a slow or busy runner is not a broken
  # build. A case over its budget becomes a warning on the run and a row in the job summary. The job fails only when a
  # case breaks or makes different output between runs.
  budgets:
    name: Speed budgets (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run bench -- --budgets

  mcpb:
    name: MCPB bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/build-mcpb.mjs --check
      - run: node scripts/verify-mcpb.mjs dist/mcpb/pixelbolt.mcpb
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate dist/mcpb/manifest.json
